<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1f2430;--muted:#7b8294;--line:#e6e8ee;
  --accent:#4f46e5;--accent-text:#fff;--danger:#dc2626;--hover:#f0f1f8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161c;--card:#1d2029;--text:#e8eaf0;--muted:#8b93a7;--line:#2b2f3b;
    --accent:#818cf8;--accent-text:#14161c;--danger:#f87171;--hover:#262a37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c;--card:#1d2029;--text:#e8eaf0;--muted:#8b93a7;--line:#2b2f3b;
  --accent:#818cf8;--accent-text:#14161c;--danger:#f87171;--hover:#262a37;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  display:flex;justify-content:center;padding:32px 16px}
.app{width:100%;max-width:520px}
h1{font-size:1.6rem;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
form{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
input[type=text]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:0}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;color:var(--text);background:transparent}
.add{background:var(--accent);color:var(--accent-text);padding:0 16px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:none}
li:hover{background:var(--hover)}
li input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.text{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
li.done .text{text-decoration:line-through;color:var(--muted)}
.edit-input{flex:1;min-width:0}
.icon{padding:4px 8px;color:var(--muted);font-size:.85rem}
.icon:hover{color:var(--text);background:var(--line)}
.icon.del:hover{color:var(--danger)}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;
  padding:10px 12px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.filters{display:flex;gap:4px}
.filters button{padding:4px 10px;color:var(--muted);border:1px solid transparent}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.clear:hover{color:var(--danger)}
.theme{font-size:1.1rem;padding:4px 8px}
</style>
</head>
<body>
<main class="app">
  <h1>To-Do List <button class="theme" id="theme" aria-label="Toggle theme">◐</button></h1>
  <div class="card">
    <form id="form" autocomplete="off">
      <input type="text" id="new" placeholder="What needs doing?" aria-label="New task" maxlength="200">
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <footer>
      <span id="count"></span>
      <div class="filters" id="filters">
        <button data-filter="all">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
      <button class="clear icon" id="clear">Clear completed</button>
    </footer>
  </div>
  <p class="empty" style="font-size:.8rem">Double-click a task to edit it. Enter saves, Esc cancels.</p>
</main>
<script>
(function () {
  'use strict';
  var KEY = 'todo-app-v1';
  var state = { todos: [], filter: 'all' };
  var editingId = null;

  var els = {
    form: document.getElementById('form'),
    input: document.getElementById('new'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    filters: document.getElementById('filters'),
    clear: document.getElementById('clear'),
    theme: document.getElementById('theme')
  };

  // ---------- Persistence ----------
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.todos)) {
        state.todos = data.todos.filter(function (t) {
          return t && typeof t.id === 'string' && typeof t.text === 'string';
        });
        if (['all', 'active', 'completed'].indexOf(data.filter) !== -1) state.filter = data.filter;
      }
    } catch (e) { /* empty or blocked storage: start fresh */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- State helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function visible() {
    return state.todos.filter(function (t) {
      return state.filter === 'all' || (state.filter === 'active' ? !t.done : t.done);
    });
  }
  function update(fn) { fn(); save(); render(); }

  // ---------- Rendering ----------
  function buildItem(t) {
    var li = document.createElement('li');
    li.dataset.id = t.id;
    if (t.done) li.className = 'done';

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.done;
    cb.dataset.action = 'toggle';
    cb.setAttribute('aria-label', 'Mark complete');
    li.appendChild(cb);

    if (editingId === t.id) {
      var ed = document.createElement('input');
      ed.type = 'text';
      ed.className = 'edit-input';
      ed.value = t.text;
      ed.maxLength = 200;
      ed.dataset.action = 'edit-field';
      li.appendChild(ed);
    } else {
      var span = document.createElement('span');
      span.className = 'text';
      span.dataset.action = 'text';
      span.textContent = t.text;
      li.appendChild(span);

      var edit = document.createElement('button');
      edit.className = 'icon';
      edit.dataset.action = 'edit';
      edit.textContent = 'Edit';
      li.appendChild(edit);

      var del = document.createElement('button');
      del.className = 'icon del';
      del.dataset.action = 'delete';
      del.textContent = 'Delete';
      li.appendChild(del);
    }
    return li;
  }

  function render() {
    els.list.textContent = '';
    var items = visible();
    if (!items.length) {
      var p = document.createElement('li');
      p.className = 'empty';
      p.style.display = 'block';
      p.textContent = state.todos.length ? 'Nothing in this view.' : 'No tasks yet. Add one above!';
      els.list.appendChild(p);
    } else {
      var frag = document.createDocumentFragment();
      items.forEach(function (t) { frag.appendChild(buildItem(t)); });
      els.list.appendChild(frag);
    }
    var left = state.todos.filter(function (t) { return !t.done; }).length;
    els.count.textContent = left + (left === 1 ? ' item left' : ' items left');
    els.clear.hidden = !state.todos.some(function (t) { return t.done; });
    Array.prototype.forEach.call(els.filters.children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter));
    });
    var ef = els.list.querySelector('.edit-input');
    if (ef) { ef.focus(); ef.setSelectionRange(ef.value.length, ef.value.length); }
  }

  // ---------- Actions ----------
  function addTodo(text) {
    text = text.trim();
    if (!text) return;
    update(function () { state.todos.push({ id: uid(), text: text, done: false }); });
  }
  function finishEdit(id, value, commit) {
    var text = value.trim();
    update(function () {
      editingId = null;
      if (!commit) return;
      if (!text) {
        state.todos = state.todos.filter(function (t) { return t.id !== id; });
      } else {
        state.todos.forEach(function (t) { if (t.id === id) t.text = text; });
      }
    });
  }

  // ---------- Event delegation ----------
  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    addTodo(els.input.value);
    els.input.value = '';
    els.input.focus();
  });

  els.list.addEventListener('click', function (e) {
    var target = e.target.closest('[data-action]');
    var li = e.target.closest('li[data-id]');
    if (!target || !li) return;
    var id = li.dataset.id, action = target.dataset.action;
    if (action === 'delete') {
      update(function () { state.todos = state.todos.filter(function (t) { return t.id !== id; }); });
    } else if (action === 'edit') {
      editingId = id; render();
    }
  });

  els.list.addEventListener('change', function (e) {
    if (e.target.dataset.action !== 'toggle') return;
    var id = e.target.closest('li').dataset.id;
    update(function () {
      state.todos.forEach(function (t) { if (t.id === id) t.done = e.target.checked; });
    });
  });

  els.list.addEventListener('dblclick', function (e) {
    if (e.target.dataset.action !== 'text') return;
    editingId = e.target.closest('li').dataset.id;
    render();
  });

  els.list.addEventListener('keydown', function (e) {
    if (e.target.dataset.action !== 'edit-field') return;
    var id = e.target.closest('li').dataset.id;
    if (e.key === 'Enter') finishEdit(id, e.target.value, true);
    else if (e.key === 'Escape') finishEdit(id, e.target.value, false);
  });

  els.list.addEventListener('focusout', function (e) {
    if (e.target.dataset.action !== 'edit-field' || editingId === null) return;
    finishEdit(e.target.closest('li').dataset.id, e.target.value, true);
  });

  els.filters.addEventListener('click', function (e) {
    var b = e.target.closest('[data-filter]');
    if (!b) return;
    update(function () { state.filter = b.dataset.filter; });
  });

  els.clear.addEventListener('click', function () {
    update(function () { state.todos = state.todos.filter(function (t) { return !t.done; }); });
  });

  els.theme.addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });

  load();
  render();
})();
</script>
</body>
</html>
